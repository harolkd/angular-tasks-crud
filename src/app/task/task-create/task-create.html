<div class="form-layout">
  <div class="form-card">
    <div class="form-header">
      <div class="back-link" (click)="cancel()">← Volver a la lista</div>
      <h2>Crear Nueva Tarea</h2>
      <p>Crea una nueva actividad para tu lista de tareas diarias.</p>
    </div>

    <div *ngIf="errorMessage" class="error-banner">
      <span>⚠️ {{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" #taskForm="ngForm" novalidate>
      <div class="form-group">
        <label for="title">Título de la tarea <span class="required">*</span></label>
        <input type="text" id="title" name="title" placeholder="Escribe un título descriptivo..."
          [(ngModel)]="task.title" required #titleInput="ngModel" [class.has-error]="errorMessage && !task.title" />
        <span class="help-text" *ngIf="errorMessage && !task.title">El título es obligatorio para identificar la
          tarea.</span>
      </div>

      <div class="form-group">
        <label for="description">Descripción</label>
        <textarea id="description" name="description" rows="4"
          placeholder="Agrega detalles o notas adicionales sobre la tarea..." [(ngModel)]="task.description"></textarea>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="cancel()" [disabled]="isLoading">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="isLoading">
          <span class="btn-spinner" *ngIf="isLoading"></span>
          {{ isLoading ? 'Guardando...' : 'Crear Tarea' }}
        </button>
      </div>
    </form>
  </div>
</div>
